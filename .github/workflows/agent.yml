name: Claude

# Consumer stub for the freaxnx01/agent-workflow reusable pipeline.
#
# Two triggers, and both are required:
#   - issues:labeled with `ai-implement`        → first run on a fresh task
#   - workflow_dispatch (issue-number, attempt) → retry, re-dispatched by the
#     pipeline's own scripts/retry-dispatch.sh, which calls
#     `gh workflow run <consumer> -f issue-number=<N> -f attempt=<N+1>` and
#     defaults <consumer> to this file (agent.yml). Without the dispatch
#     trigger every retry fails to launch — the first attempt is all you get.
#
# Fork-PR protection: no `pull_request` / `pull_request_target` trigger. Forks
# cannot label issues upstream, and workflow_dispatch is restricted to users
# with write access, so neither entry point is fork-reachable.

on:
  issues:
    types: [labeled]
  workflow_dispatch:
    inputs:
      issue-number:
        description: GitHub issue number to (re-)implement.
        type: number
        required: true
      attempt:
        description: 1-based retry attempt counter (drives retry-policy caps).
        type: number
        default: 1

permissions:            # a reusable workflow can't be granted more than its
  contents: write       # caller; the repo's default GITHUB_TOKEN is read-only,
  pull-requests: write  # so omitting this fails the run at startup_failure.
  issues: write
  actions: write        # required for the self-redispatch on retry

jobs:
  claude:
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.label.name == 'ai-implement' }}
    uses: freaxnx01/agent-workflow/.github/workflows/agent-implement.yml@v1.13.0
    secrets:
      CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
      # Optional GitHub App (agent-workflow #55). Both are declared required:false
      # upstream, so while the secrets are unset these pass through empty and the
      # pipeline falls back to GITHUB_TOKEN exactly as before — wiring them early
      # costs nothing and means enabling the App is a secrets-only change.
      #
      # Why it matters: a PR opened with the ambient GITHUB_TOKEN does not trigger
      # workflows, so #29 landed with no checks at all and needed a manual
      # close/reopen to run CI. An App-authored PR triggers them normally.
      #
      # Still required before this does anything (see agent-workflow
      # docs/CONSUMER-SETUP.md "Enabling the GitHub App for PR creation"):
      #   1. create the App (Contents R/W, Pull requests R/W, Issues R/W)
      #   2. install it on this repo and generate a private key
      #   3. set PIPELINE_APP_ID + PIPELINE_APP_PRIVATE_KEY as repo secrets
      #   4. add `pipeline-author-allowlist: <app-name>[bot]` to `with:` above
      PIPELINE_APP_ID: ${{ secrets.PIPELINE_APP_ID }}
      PIPELINE_APP_PRIVATE_KEY: ${{ secrets.PIPELINE_APP_PRIVATE_KEY }}
    with:
      issue-number: ${{ github.event.inputs.issue-number || github.event.issue.number }}
      attempt: ${{ fromJSON(github.event.inputs.attempt || '1') }}
      # Force GitHub-hosted runners — never attach a self-hosted runner to a
      # public repo (fork-PR / pwn-request attack surface).
      runner-labels: '["ubuntu-latest"]'
      default-model: claude-sonnet-5
      pipeline-ref: v1.13.0
      # .NET builds + tests are slower than trivial markdown changes.
      timeout-minutes: 60
      # The pipeline default of 30 turns is sized for a single-file change. A
      # FlowHub feature issue is an enriched multi-task plan implemented under
      # TDD, where every step costs at least four turns (write the failing test,
      # run it RED, implement, run it GREEN) before the commit. Issue #20 — 7
      # tasks, 50 steps, ~15 files — exhausted 30 turns on orientation alone and
      # produced no PR (run 32873223257, error_max_turns). At 200 it reached
      # task 6 of 7 in 33 minutes before hitting the cap again (run 32883249971),
      # so 300 is sized off that measurement rather than a guess.
      max-turns: 300
      # Wall-clock cap on the claude process itself — distinct from
      # timeout-minutes above, which caps the job. Left unset it defaults to 10
      # minutes, and #20 was killed at exit 124 on task 3 of 7 with turns barely
      # touched (run 32879917041). A .NET build plus Testcontainers needs far
      # more; 55 keeps the process cap below the 60-minute job cap so the job
      # still reports a result instead of being killed outright.
      claude-timeout-minutes: 55
